name: Build Watch8 PureTimer from one ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack single ZIP and build
        run: |
          mkdir -p source
          unzip -q Watch8_PureTimer_V4_VibrationFix_OneUpload.zip -d source
          cd source
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Watch8-PureTimer-V4-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
